# MuTrack Beacon Scanner Configuration
# Copy this file to config.yaml and fill in your API key

# Convex backend URL (your deployment URL + /api/scanner)
api_url: https://your-app.convex.site/api/scanner

# Scanner API key (get this from Admin > Scanners > Register Scanner)
api_key: msk_your_api_key_here

# Scanning settings
scan_interval: 1.0          # Seconds between scan cycles
upload_interval: 10.0       # Seconds between batch uploads to server
presence_ttl: 30.0          # Seconds before beacon is considered "gone"
retry_interval: 60.0        # Seconds between retries on network failure

# Logging
log_level: INFO             # DEBUG, INFO, WARNING, ERROR
